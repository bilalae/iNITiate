<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Initiate: NIT's Science & Tech Society</title>

  <meta
    name="description"
    content="Initiate is a Science & Technology Society focused on skill growth, innovation, research, and impactful speaker series events."
  />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="Initiate: NIT's Science & Tech Society"
  />

  <meta
    property="og:description"
    content="A Science & Technology Society focused on skill building, growth, innovation, research, and impactful speaker series events."
  />

  <meta
    property="og:url"
    content="https://initiate-nit.vercel.app/"
  />

  <meta
    property="og:image"
    content="https://image2url.com/r2/default/images/1771620327086-98c5b9d6-d2cb-4091-bb7e-208000699387.jpg"
  />

  <!-- Twitter -->
  <meta
    property="twitter:card"
    content="summary_large_image"
  />

  <meta
    property="twitter:title"
    content="Initiate: Science & Tech Society"
  />

  <meta
    property="twitter:description"
    content="Innovation. Research. Impact."
  />

  <meta
    property="twitter:image"
    content="https://image2url.com/r2/default/images/1771620327086-98c5b9d6-d2cb-4091-bb7e-208000699387.jpg"
  />

  <link
    rel="icon"
    type="image/png"
    href="/initiate-mini-logo.png"
  />

  <meta
    name="theme-color"
    content="#07090d"
  />

  <meta
    name="color-scheme"
    content="dark"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #07090d;

      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      color: #ffffff;

      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;

      background: #07090d;
    }

    /* =====================================================
       INITIAL SCREEN
    ====================================================== */

    #initial-paint {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;

      background: #07090d;

      pointer-events: none;
    }

    #initial-paint::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 51%;

      width: 320px;
      height: 160px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(127, 29, 29, 0.04),
          transparent 70%
        );

      filter: blur(40px);
    }

    /* =====================================================
       STAGE
    ====================================================== */

    .initial-stage {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateY(-1vh);
    }

    /* =====================================================
       WORDMARK
    ====================================================== */

    .initial-brand {
      display: flex;
      align-items: baseline;

      margin: 0;

      color: rgba(255, 255, 255, 0.95);

      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:
        clamp(
          35px,
          9.5vw,
          44px
        );

      font-weight: 600;

      line-height: 1;

      letter-spacing: -0.038em;

      white-space: nowrap;
    }

    .brand-i,
    .brand-nit,
    .brand-iate {
      display: inline-block;

      will-change:
        transform,
        opacity;
    }

    .brand-i {
      opacity: 0;

      transform: translateX(-4px);

      animation:
        settle-left
        620ms
        70ms
        cubic-bezier(.22, 1, .36, 1)
        forwards;
    }

    .brand-nit {
      color: #b91c1c;

      opacity: 0;

      transform: translateY(4px);

      animation:
        settle-nit
        650ms
        130ms
        cubic-bezier(.22, 1, .36, 1)
        forwards;
    }

    .brand-iate {
      opacity: 0;

      transform: translateX(4px);

      animation:
        settle-right
        620ms
        190ms
        cubic-bezier(.22, 1, .36, 1)
        forwards;
    }

    /* =====================================================
       HAIRLINE
    ====================================================== */

    .initial-line {
      position: relative;

      width: 68px;
      height: 1px;

      margin-top: 19px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.06);

      opacity: 0;

      animation:
        fade-in
        350ms
        500ms
        ease
        forwards;
    }

    .initial-line::after {
      content: "";

      position: absolute;

      top: 0;
      left: -22px;

      width: 20px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(185, 28, 28, 0.9),
          transparent
        );

      animation:
        line-pass
        1.7s
        650ms
        cubic-bezier(.4, 0, .2, 1)
        infinite;
    }

    /* =====================================================
       STATUS
    ====================================================== */

    .initial-status {
      margin-top: 12px;

      color: rgba(203, 213, 225, 0.34);

      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 9px;
      font-weight: 400;

      line-height: 1;

      letter-spacing: 0.15em;

      opacity: 0;

      transform: translateY(2px);

      animation:
        status-enter
        400ms
        610ms
        ease
        forwards;
    }

    /* =====================================================
       MOTION
    ====================================================== */

    @keyframes settle-left {
      from {
        opacity: 0;
        transform: translateX(-4px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes settle-nit {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes settle-right {
      from {
        opacity: 0;
        transform: translateX(4px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes line-pass {
      0% {
        left: -22px;
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      58% {
        opacity: 1;
      }

      78% {
        left: 100%;
        opacity: 0;
      }

      100% {
        left: 100%;
        opacity: 0;
      }
    }

    @keyframes status-enter {
      from {
        opacity: 0;
        transform: translateY(2px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {
      .brand-i,
      .brand-nit,
      .brand-iate,
      .initial-line,
      .initial-line::after,
      .initial-status {
        animation: none;
      }

      .brand-i,
      .brand-nit,
      .brand-iate,
      .initial-line,
      .initial-status {
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link

  />
