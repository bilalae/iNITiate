<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Primary SEO -->
  <title>Initiate: NIT's Science & Tech Society</title>

  <meta
    name="description"
    content="Initiate is a Science & Technology Society focused on skill growth, innovation, research, and impactful speaker series events."
  />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="Initiate: NIT's Science & Tech Society"
  />

  <meta
    property="og:description"
    content="A Science & Technology Society focused on skill building, growth, innovation, research, and impactful speaker series events."
  />

  <meta
    property="og:url"
    content="https://initiate-nit.vercel.app/"
  />

  <meta
    property="og:image"
    content="https://image2url.com/r2/default/images/1771620327086-98c5b9d6-d2cb-4091-bb7e-208000699387.jpg"
  />

  <meta
    property="og:image:secure_url"
    content="https://image2url.com/r2/default/images/1771620327086-98c5b9d6-d2cb-4091-bb7e-208000699387.jpg"
  />

  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />

  <!-- Twitter -->
  <meta
    property="twitter:card"
    content="summary_large_image"
  />

  <meta
    property="twitter:title"
    content="Initiate: Science & Tech Society"
  />

  <meta
    property="twitter:description"
    content="Innovation. Research. Impact."
  />

  <meta
    property="twitter:image"
    content="https://image2url.com/r2/default/images/1771620327086-98c5b9d6-d2cb-4091-bb7e-208000699387.jpg"
  />

  <!-- Core -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <link
    rel="icon"
    type="image/png"
    href="/initiate-mini-logo.png"
  />

  <!-- =====================================================
       INITIAL SAFARI PAINT

       This is intentionally inline.

       It can render before Tailwind, React, fonts,
       index.css or AnimatedBackground have loaded.
  ====================================================== -->

  <meta
    name="theme-color"
    content="#07090d"
  />

  <meta
    name="color-scheme"
    content="dark"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <style>
    html {
      margin: 0;
      padding: 0;

      background-color: #07090d;

      color-scheme: dark;
    }

    body {
      margin: 0;
      padding: 0;

      min-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background-color: #07090d;

      color: #ffffff;

      font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;

      background-color: #07090d;
    }

    /*
      This exists only during the tiny period before
      React takes control of #root.

      React replaces it when the application mounts.
    */

    #initial-paint {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background-color: #07090d;

      pointer-events: none;
    }
  </style>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Import map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
      }
    }
  </script>

  <link
    rel="stylesheet"
    href="/index.css"
  />
</head>

<body>
  <div id="root">
    <div
      id="initial-paint"
      aria-hidden="true"
    ></div>
  </div>

  <script
    type="module"
    src="/index.tsx"
  ></script>
</body>
</html>
