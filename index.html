  <!-- =====================================================
       INITIAL PAINT + LOADING STATE
  ====================================================== -->

  <style>
    html {
      margin: 0;
      padding: 0;

      background: #07090d;

      color-scheme: dark;
    }

    body {
      margin: 0;
      padding: 0;

      min-width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: #07090d;
      color: #ffffff;

      font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;

      background: #07090d;
    }

    /* =====================================================
       PRE-REACT LOADER
    ====================================================== */

    #initial-paint {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 58%,
          rgba(127, 29, 29, 0.12),
          transparent 34%
        ),
        #07090d;

      pointer-events: none;
    }

    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateY(-2vh);

      animation:
        loader-enter 500ms cubic-bezier(.22, 1, .36, 1) both;
    }

    /* iNITiate */

    .initial-brand {
      margin: 0;

      color: #ffffff;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: -0.055em;
      line-height: 1;
    }

    .initial-brand-nit {
      color: #b91c1c;
    }

    /* Initiating... */

    .initial-status {
      margin: 14px 0 0;

      color: rgba(203, 213, 225, 0.58);

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.14em;
    }

    /* progress track */

    .initial-progress {
      position: relative;

      width: 104px;
      height: 1px;

      margin-top: 18px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.08);
    }

    /* moving maroon light */

    .initial-progress::after {
      content: "";

      position: absolute;
      top: 0;
      left: 0;

      width: 42%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        #991b1b,
        #b91c1c,
        transparent
      );

      transform: translateX(-110%);

      animation:
        initiate-progress 1.25s
        cubic-bezier(.4, 0, .2, 1)
        infinite;
    }

    /* subtle light underneath */

    .initial-glow {
      position: absolute;

      left: 50%;
      top: 54%;

      width: 220px;
      height: 100px;

      transform: translate(-50%, -50%);

      border-radius: 999px;

      background: rgba(127, 29, 29, 0.07);

      filter: blur(55px);

      animation:
        glow-breathe 2.4s ease-in-out infinite;
    }

    @keyframes loader-enter {
      from {
        opacity: 0;
        transform: translateY(calc(-2vh + 8px));
      }

      to {
        opacity: 1;
        transform: translateY(-2vh);
      }
    }

    @keyframes initiate-progress {
      0% {
        transform: translateX(-110%);
      }

      55% {
        transform: translateX(135%);
      }

      100% {
        transform: translateX(245%);
      }
    }

    @keyframes glow-breathe {
      0%,
      100% {
        opacity: 0.45;
        transform:
          translate(-50%, -50%)
          scale(0.92);
      }

      50% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .initial-loader,
      .initial-progress::after,
      .initial-glow {
        animation: none;
      }

      .initial-progress::after {
        left: 29%;
        transform: none;
      }
    }
  </style>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Import map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

      }
    }
  </script>

  <link rel="stylesheet" href="/index.css" />
</head>

<body>
  <div id="root">

    <!--
      Visible only before React mounts.
      React replaces this automatically.
    -->

    <div id="initial-paint" aria-hidden="true">

      <div class="initial-glow"></div>

      <div class="initial-loader">

        <p class="initial-brand">
          i<span class="initial-brand-nit">NIT</span>iate
        </p>

        <p class="initial-status">
          Initiating…
        </p>

        <div class="initial-progress"></div>

      </div>

    </div>

  </div>

  <script
    type="module"
    src="/index.tsx"
  ></script>
</body>
